<!doctype html>
<html lang="en-GB">
  <head>
    <!-- @include head -->
    <title>Page not found — EdgeeTech</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- @include header -->
    <main id="main">
      <section class="page-hero notfound">
        <div class="bg-grid" aria-hidden="true"></div>
        <div class="aurora aurora--a" aria-hidden="true"></div>
        <div class="aurora aurora--b" aria-hidden="true"></div>
        <div class="container">
          <p class="eyebrow" data-reveal>404</p>
          <h1 class="display" data-reveal style="--d: 1; margin-inline: auto">This page <span class="serif gradient-text">doesn't exist.</span></h1>
          <p class="lede" data-reveal style="--d: 2; margin-inline: auto">It may have moved when we rebuilt the site. Everything that matters is a click away.</p>
          <figure class="terminal" data-animate data-reveal style="--d: 3">
            <div class="terminal-bar" aria-hidden="true"><i></i><i></i><i></i><span>~/edgeetech — zsh</span></div>
            <div class="terminal-body">
              <span class="line"><span class="t-prompt">$</span> <span class="t-cmd">cd <span class="requested-path">this-page</span></span></span>
              <span class="line"><span class="t-hash">cd: no such file or directory</span></span>
              <span class="line"><span class="t-prompt">$</span> <span class="t-cmd">ls</span></span>
              <span class="line"><span class="t-year">services  products  work  about  contact</span></span>
              <span class="line"><span class="t-prompt">$</span> <span class="caret" aria-hidden="true"></span></span>
            </div>
          </figure>
          <div class="actions" data-reveal style="--d: 4">
            <a class="btn btn--primary" href="/index.html">Back to home <span class="arrow" aria-hidden="true">→</span></a>
            <a class="btn" href="/contact.html">Contact us</a>
          </div>
        </div>
      </section>
    </main>
    <!-- @include footer -->
  </body>
</html>
